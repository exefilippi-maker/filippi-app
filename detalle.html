<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle del Vehículo</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a1a2f, #0f2f55);
      color: white;
    }

    .container {
      padding: 20px;
    }

    h1 {
      margin: 10px 0;
      font-size: 24px;
    }

    .info p {
      margin: 6px 0;
      color: #cfd8e3;
      font-size: 16px;
    }

    .precio {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
      color: #ffffff;
    }

    .badge {
      display: inline-block;
      background: #1e88e5;
      padding: 6px 10px;
      border-radius: 8px;
      margin: 5px 5px 5px 0;
      font-size: 14px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      background: #25D366;
      color: white;
      font-weight: bold;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
    }

    .volver {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #ccc;
      text-decoration: none;
    }

    /* 🔥 GALERÍA PRO */
    .galeria {
      text-align: center;
    }

    .imagen-principal {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .miniaturas {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .miniaturas img {
      width: 70px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .miniaturas img:hover {
      transform: scale(1.1);
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- 🔥 GALERÍA -->
    <div class="galeria">
      <img id="imagen-principal" class="imagen-principal">
      <div class="miniaturas" id="miniaturas"></div>
    </div>

    <h1 id="modelo"></h1>

    <div class="info">
      <p id="anio"></p>
      <p id="km"></p>
      <p class="precio" id="precio"></p>
    </div>

    <div id="badges"></div>

    <a id="whatsapp" class="whatsapp" target="_blank">
      📲 Consultar por WhatsApp
    </a>

    <a href="index.html" class="volver">⬅ Volver</a>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const modelo = params.get("modelo");
    const anio = params.get("anio");
    const km = params.get("km");
    const precio = params.get("precio");
    const imagen = params.get("imagen");
    const financiacion = params.get("financiacion");
    const permuta = params.get("permuta");

    // 🔥 GALERÍA
    const imagenPrincipal = document.getElementById("imagen-principal");
    const contenedorMiniaturas = document.getElementById("miniaturas");

    let imagenes = [];

    const imagenesParam = params.get("imagenes");

    if (imagenesParam) {
      imagenes = imagenesParam.split(",");
    } else {
      imagenes = [imagen]; // fallback
    }

    imagenPrincipal.src = imagenes[0];

    imagenes.forEach(img => {
      const mini = document.createElement("img");
      mini.src = img;

      mini.onclick = () => {
        imagenPrincipal.src = img;
      };

      contenedorMiniaturas.appendChild(mini);
    });

    // datos
    document.getElementById("modelo").innerText = modelo;
    document.getElementById("anio").innerText = "📅 Año: " + anio;
    document.getElementById("km").innerText = "🛣️ Km: " + km;
    document.getElementById("precio").innerText = precio;

    // badges
    const badges = document.getElementById("badges");

    if (financiacion === "SI") {
      badges.innerHTML += `<span class="badge">💳 Financiación disponible</span>`;
    }

    if (permuta === "SI") {
      badges.innerHTML += `<span class="badge">🔁 Recibe permuta</span>`;
    }

    // WhatsApp
    const mensaje = `Hola, te consulto por el ${modelo} ${anio} con ${km} km. ¿Sigue disponible?`;
    const telefono = "5493812082314";

    document.getElementById("whatsapp").href =
      `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
  </script>

</body>
</html>
