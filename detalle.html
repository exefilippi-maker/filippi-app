<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del Vehículo — Filippi Automotores</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a1a2f, #0f2f55);
      color: white;
      min-height: 100vh;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* ─── GALERÍA ─────────────────────────────── */
    .galeria {
      text-align: center;
      margin-bottom: 20px;
    }

    .imagen-principal {
      width: 100%;
      max-width: 460px;
      height: 260px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .miniaturas {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .miniaturas img {
      width: 68px;
      height: 52px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, border 0.2s;
      border: 2px solid transparent;
    }

    .miniaturas img:hover {
      transform: scale(1.08);
    }

    .miniaturas img.activa {
      border: 2px solid #00c2ff;
    }

    /* ─── INFO ────────────────────────────────── */
    h1 {
      margin: 12px 0 6px;
      font-size: 22px;
      line-height: 1.3;
    }

    .info p {
      margin: 5px 0;
      color: #cfd8e3;
      font-size: 15px;
    }

    .precio {
      font-size: 24px;
      font-weight: bold;
      margin: 14px 0 10px;
      color: #00c2ff;
    }

    /* ─── BADGES ──────────────────────────────── */
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 20px;
    }

    .badge {
      background: #1e88e5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    /* ─── BOTONES ─────────────────────────────── */
    .whatsapp {
      display: block;
      text-align: center;
      padding: 15px;
      background: #25D366;
      color: white;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .whatsapp:hover {
      background: #1ebe5d;
    }

    .volver {
      display: block;
      text-align: center;
      color: #9db4cc;
      text-decoration: none;
      font-size: 15px;
      padding: 10px;
    }

    .volver:hover {
      color: white;
    }

    /* ─── RESPONSIVE ──────────────────────────── */
    @media (max-width: 480px) {
      .imagen-principal {
        height: 220px;
      }

      h1 {
        font-size: 19px;
      }

      .precio {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="galeria">
      <img id="imagen-principal" class="imagen-principal" alt="Foto del vehículo">
      <div class="miniaturas" id="miniaturas"></div>
    </div>

    <h1 id="modelo"></h1>

    <div class="info">
      <p id="anio"></p>
      <p id="km"></p>
      <p class="precio" id="precio"></p>
    </div>

    <div class="badges" id="badges"></div>

    <a id="whatsapp" class="whatsapp" target="_blank" rel="noopener">
      📲 Consultar por WhatsApp
    </a>

    <a href="index.html" class="volver">⬅ Volver al catálogo</a>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const modelo      = params.get("modelo")      || "";
    const anio        = params.get("anio")         || "";
    const km          = params.get("km")           || "";
    const precio      = params.get("precio")       || "";
    const imagen      = params.get("imagen")       || "";
    const financiacion = params.get("financiacion") || "NO";
    const permuta     = params.get("permuta")      || "NO";

    // ─── GALERÍA ───────────────────────────────
    const imgPrincipal = document.getElementById("imagen-principal");
    const contenedorMinis = document.getElementById("miniaturas");

    const imagenesParam = params.get("imagenes");
    const imagenes = (imagenesParam && imagenesParam.trim())
      ? imagenesParam.split(",").map(i => i.trim()).filter(Boolean)
      : [imagen];

    imgPrincipal.src = imagenes[0];

    function setActiva(miniActiva) {
      contenedorMinis.querySelectorAll("img").forEach(m => m.classList.remove("activa"));
      miniActiva.classList.add("activa");
    }

    imagenes.forEach((src, index) => {
      const mini = document.createElement("img");
      mini.src = src;
      mini.alt = "Foto " + (index + 1);
      mini.loading = "lazy";
      if (index === 0) mini.classList.add("activa");

      mini.addEventListener("click", () => {
        imgPrincipal.src = src;
        setActiva(mini);
      });

      contenedorMinis.appendChild(mini);
    });

    // ─── DATOS ─────────────────────────────────
    document.getElementById("modelo").textContent = modelo;
    document.getElementById("anio").textContent   = "📅 Año: " + anio;

    const kmFormateado = km ? Number(km).toLocaleString("es-AR") + " km" : "";
    document.getElementById("km").textContent = "🛣️ " + kmFormateado;

    const precioFormateado = precio
      ? "$" + Number(precio).toLocaleString("es-AR")
      : "Consultar precio";
    document.getElementById("precio").textContent = precioFormateado;

    // ─── BADGES ────────────────────────────────
    const badges = document.getElementById("badges");

    if (financiacion === "SI") {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = "💳 Financiación disponible";
      badges.appendChild(b);
    }

    if (permuta === "SI") {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = "🔁 Recibe permuta";
      badges.appendChild(b);
    }

    // ─── WHATSAPP ───────────────────────────────
    const mensaje = `Hola, te consulto por el ${modelo} ${anio} con ${kmFormateado}. ¿Sigue disponible?`;
    document.getElementById("whatsapp").href =
      `https://wa.me/5493812082314?text=${encodeURIComponent(mensaje)}`;

    // ─── TÍTULO DE PESTAÑA ──────────────────────
    if (modelo) document.title = modelo + " — Filippi Automotores";
  </script>

</body>
</html>
